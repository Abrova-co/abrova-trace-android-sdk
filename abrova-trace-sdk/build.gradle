plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
    id 'com.google.protobuf'
}

android {
    namespace 'ir.abrova.trace.sdk'
    compileSdk 34

    defaultConfig {
        // API 16 = Android 4.1 Jelly Bean (maximum compatibility)
        // This covers 99.9%+ of all Android devices
        minSdk 16
        targetSdk 34

        consumerProguardFiles 'proguard-rules.pro'

        buildConfigField "String", "SDK_VERSION", "\"${project.findProperty('SDK_VERSION') ?: '1.0.0'}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }

    // Support older devices
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // JSON parsing (lightweight, compatible with API 16+)
    implementation 'com.google.code.gson:gson:2.10.1'

    // HTTP client (OkHttp 3.x for API 16+ support, OkHttp 4.x requires API 21+)
    // Using OkHttp 3.12.x for maximum compatibility (last version supporting API 16-20)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // Lifecycle for detecting app foreground/background
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'

    // WorkManager for background tasks (optional, for deferred error reporting)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Protobuf runtime for parsing binary Android tombstones produced by
    // ApplicationExitInfo.getTraceInputStream() on API 30+. Lite runtime
    // (~130KB) is the Android-optimised variant.
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Codegen Java classes from vendored tombstone.proto (see src/main/proto/).
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                // "lite" produces the smaller runtime we depend on above.
                java {
                    option 'lite'
                }
            }
        }
    }
}

// Maven Central Publishing via Sonatype Central Portal
import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.SonatypeHost

mavenPublishing {
    configure(new AndroidSingleVariantLibrary("release", true, true))

    coordinates("ir.abrova.trace", "abrova-trace-android-sdk", project.findProperty('SDK_VERSION') ?: '0.1.0')

    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

    signAllPublications()

    pom {
        name = "AbrovaTrace Android SDK"
        description = "Android SDK for AbrovaTrace - error tracking, crash detection, and performance monitoring"
        url = "https://github.com/Abrova-co/abrova-trace-android-sdk"
        inceptionYear = "2025"

        licenses {
            license {
                name = "MIT License"
                url = "https://opensource.org/licenses/MIT"
                distribution = "repo"
            }
        }

        developers {
            developer {
                id = "abrova"
                name = "Abrova"
                url = "https://github.com/Abrova-co"
            }
        }

        scm {
            url = "https://github.com/Abrova-co/abrova-trace-android-sdk"
            connection = "scm:git:git://github.com/Abrova-co/abrova-trace-android-sdk.git"
            developerConnection = "scm:git:ssh://git@github.com/Abrova-co/abrova-trace-android-sdk.git"
        }
    }
}

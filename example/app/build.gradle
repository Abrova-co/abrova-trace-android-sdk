plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.abrova.trace.example'
    compileSdk 34

    defaultConfig {
        applicationId "ir.abrova.trace.example"
        minSdk 21  // Example uses API 21+, but SDK supports API 19+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Optional, from local.properties (never committed): abrovatrace.apiKey and abrovatrace.apiUrl
        // (another Trace server, for example one you run yourself). Empty = the values in the code.
        def props = new Properties()
        def file = rootProject.file('local.properties')
        if (file.exists()) file.withInputStream { props.load(it) }
        buildConfigField 'String', 'ABROVA_TRACE_API_KEY', "\"${props.getProperty('abrovatrace.apiKey', '')}\""
        buildConfigField 'String', 'ABROVA_TRACE_API_URL', "\"${props.getProperty('abrovatrace.apiUrl', '')}\""

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AbrovaTrace SDK
    implementation project(':abrova-trace-sdk')

    // Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // OkHttp for network example (matches SDK version to avoid conflicts)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
